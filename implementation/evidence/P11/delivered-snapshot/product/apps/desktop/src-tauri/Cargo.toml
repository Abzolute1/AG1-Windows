[package]
name = "ag1-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ag1_desktop"

[dependencies]
ag1-core.workspace = true
ag1-platform = { path = "../../../crates/ag1-platform" }
ag1-protocol = { path = "../../../crates/ag1-protocol" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
libc.workspace = true
rustix.workspace = true
tempfile.workspace = true
tauri = { version = "=2.11.5", features = [] }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
visual-test = ["dep:webkit2gtk", "dep:gio", "dep:javascriptcore", "dep:cairo-rs"]

[dependencies.webkit2gtk]
version = "=2.0.2"
features = ["v2_40"]
optional = true
[dependencies.gio]
version = "=0.18.4"
optional = true
[dependencies.javascriptcore]
package = "javascriptcore-rs"
version = "=1.1.2"
optional = true
[dependencies.cairo-rs]
version = "=0.18.5"
features = ["png"]
optional = true
