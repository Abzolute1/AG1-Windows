[workspace]
members = ["crates/ag1-core", "crates/ag1-protocol", "crates/ag1-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
ag1-core = { path = "crates/ag1-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
libc = "=0.2.189"
rustix = { version = "=1.1.4", features = ["fs"] }
tempfile = "=3.27.0"
