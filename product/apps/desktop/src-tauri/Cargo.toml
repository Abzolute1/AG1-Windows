[package]
name = "ag1-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ag1_desktop"

[dependencies]
ag1-core.workspace = true
ag1-platform = { path = "../../../crates/ag1-platform" }
ag1-protocol = { path = "../../../crates/ag1-protocol" }
ag1-storage = { path = "../../../crates/ag1-storage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
libc.workspace = true
rustix.workspace = true
tempfile.workspace = true
tauri = { version = "=2.11.5", features = [] }

tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[build-dependencies]
cc = "=1.4.5"
pkg-config = "=0.3.34"
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
visual-test = ["dep:gio", "dep:javascriptcore", "dep:cairo-rs", "ag1-platform/mcp-fixtures"]

[target.'cfg(target_os = "linux")'.dependencies.webkit2gtk]
version = "=2.0.2"
features = ["v2_40"]
[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "=0.18.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell_Common", "Win32_System_Com"] }
[dependencies.gio]
version = "=0.18.4"
optional = true
[dependencies.javascriptcore]
package = "javascriptcore-rs"
version = "=1.1.2"
optional = true
[dependencies.cairo-rs]
version = "=0.18.5"
features = ["png"]
optional = true
