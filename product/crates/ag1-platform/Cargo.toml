[package]
name = "ag1-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
mcp-fixtures = []

[dependencies]
ag1-core.workspace = true
ag1-storage = { path = "../ag1-storage" }
ag1-protocol = { path = "../ag1-protocol" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true
hmac = "=0.12.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
resvg = { version = "=0.45.1", default-features = false }
regex = "=1.13.1"
ignore = "=0.4.25"
globset = { version = "=0.4.18", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["native-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows workspace backend needs stable file identities and a named mutex.
# `std` does not expose either of those Windows primitives.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
native-tls = "=0.2.18"
tempfile.workspace = true
