[package]
name = "ag1-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ag1-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
tempfile.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "fallible_uint"] }
hmac = "=0.12.1"
flate2 = "=1.1.10"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
